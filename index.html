<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chrono-Mage : Duel de Destins</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
</head>
<body>
    <div id="start-screen" class="overlay">
        <h1 class="main-title">CHRONO-MAGE</h1>
        <button class="play-button" onclick="introAnimation()">COMMENCER LE DUEL</button>
    </div>

    <div id="vs-screen" class="overlay" style="display:none; opacity:0;">
        <div class="vs-container">
            <div class="vs-player">JOUEUR 1</div>
            <div class="vs-text">VS</div>
            <div class="vs-player">JOUEUR 2</div>
        </div>
    </div>

    <div id="end-screen" class="overlay" style="display:none;">
        <div class="win-box">
            <h1 id="winner-name">VICTOIRE !</h1>
            <p id="winner-text"></p>
            <button class="play-button" onclick="location.reload()">REJOUER</button>
        </div>
    </div>

    <div class="game-container">
        <div id="oracle-container" class="oracle-container">
            <div id="oracle-card" class="oracle-card">
                <div id="current-event">L'Oracle réfléchit...</div>
                <div class="card-instruction">Placez l'événement dans votre destin</div>
            </div>
        </div>

        <div class="duel-zone">
            <div class="player-side" id="P1">
                <div class="content-wrapper">
                    <div class="player-header">JOUEUR 1</div>
                    <div class="player-timer"><div id="timer-bar-P1" class="inner-bar"></div></div>
                    <div class="score-container">💰 <span id="score-P1">0</span>/5</div>
                    <div class="timeline-scale" id="scale-P1"></div>
                    <button id="btn-time-P1" class="btn-freeze" onclick="gelerTemps('P1')">❄️ GELER MON TEMPS</button>
                </div>
            </div>

            <div class="player-side" id="P2">
                <div class="content-wrapper">
                    <div class="player-header">JOUEUR 2</div>
                    <div class="player-timer"><div id="timer-bar-P2" class="inner-bar"></div></div>
                    <div class="score-container">💰 <span id="score-P2">0</span>/5</div>
                    <div class="timeline-scale" id="scale-P2"></div>
                    <button id="btn-time-P2" class="btn-freeze" onclick="gelerTemps('P2')">❄️ GELER MON TEMPS</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
