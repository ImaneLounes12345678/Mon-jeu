<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chrono-Mage : Duel Final</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="start-screen" class="overlay">
        <h1 class="glow-text">CHRONO-MAGE</h1>
        <p>Maîtrisez le temps, ordonnez l'histoire.</p>
        <button class="btn-main" onclick="startGame()">ENTRER DANS LE DUEL</button>
    </div>

    <div id="end-screen" class="overlay" style="display:none;">
        <h1 id="winner-text" class="glow-text">VICTOIRE !</h1>
        <div id="final-scores"></div>
        <button class="btn-main" onclick="location.reload()">REJOUER</button>
    </div>

    <div class="game-container">
        <div class="oracle-zone">
            <div id="current-event" class="floating">L'Oracle réfléchit...</div>
            <div class="timer-wrapper"><div id="timer-bar"></div></div>
        </div>

        <div class="duel-zone">
            <div class="player-side" id="P1">
                <h2 class="p1-title">Mage Vert</h2>
                <div class="powers">
                    <button class="btn-p" onclick="pouvoir('gel', 'P1')">❄️ GEL ENNEMI</button>
                    <button id="btn-time-P1" class="btn-p btn-special" onclick="pouvoir('temps', 'P1')" style="display:none;">⏳ ARRÊT TEMPS</button>
                </div>
                <div class="score-box">PRESTIGE: <span id="score-P1" class="score-num">0</span></div>
                <div class="timeline-scale" id="scale-P1"></div>
            </div>

            <div class="player-side" id="P2">
                <h2 class="p2-title">Mage Bleu</h2>
                <div class="powers">
                    <button class="btn-p" onclick="pouvoir('gel', 'P2')">❄️ GEL ENNEMI</button>
                    <button id="btn-time-P2" class="btn-p btn-special" onclick="pouvoir('temps', 'P2')" style="display:none;">⏳ ARRÊT TEMPS</button>
                </div>
                <div class="score-box">PRESTIGE: <span id="score-P2" class="score-num">0</span></div>
                <div class="timeline-scale" id="scale-P2"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
